[package]
name = "termrec"
version = "0.1.0"
edition = "2021"
description = "Record, replay, and chart btop terminal sessions"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vte = "0.13"
ratatui = "0.29"
crossterm = "0.28"
plotters = "0.3"
nix = { version = "0.29", features = ["term", "signal", "poll", "process", "fs"] }
chrono = "0.4"
regex = "1"
anyhow = "1"
